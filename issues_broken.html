<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="style.css" rel="stylesheet">

            theme: {

                    colors: {
                        'primary': '#4F46E5', // Indigo
                        'secondary': '#22C55E', // Emerald
                        'bg-light': '#F3F4F6', // Light Gray
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="bg-bg-light text-gray-800 antialiased" style="padding-top: 64px;">
    <nav class="fixed top-0 left-0 w-full bg-white shadow-lg z-50 transition-colors duration-300">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="index.html" class="flex-shrink-0 text-2xl font-bold text-primary">
                    <i class="fas fa-bullhorn mr-2"></i>CrowdSolve
                </a>
                <div class="hidden md:flex space-x-6 items-center">
                    <a href="index.html" class="text-gray-600 hover:text-primary transition duration-150">Home</a>
                    <a href="issues.html" class="text-primary font-semibold transition duration-150">View Issues</a>
                    <a href="report.html" class="text-gray-600 hover:text-primary transition duration-150">Report
                        Issue</a>
                    <a href="about.html" class="text-gray-600 hover:text-primary transition duration-150">About Us</a>
                    <a href="contact.html" class="text-gray-600 hover:text-primary transition duration-150">Contact</a>
                    <button id="dark-mode-toggle" class="p-2 rounded-full hover:bg-gray-100 transition duration-150"
                        aria-label="Toggle dark mode">
                        <i class="fas fa-moon text-gray-600"></i>
                    </button>
                </div>
                <button class="md:hidden p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-primary"
                    id="mobile-menu-button">
                    <i class="fas fa-bars text-gray-600"></i>
                </button>
            </div>
        </div>
        <div class="md:hidden hidden bg-white border-t border-gray-200" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="index.html"
                    class="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:bg-primary hover:text-white">Home</a>
                <a href="issues.html"
                    class="block px-3 py-2 rounded-md text-base font-medium bg-primary text-white">View Issues</a>
                <a href="report.html"
                    class="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:bg-primary hover:text-white">Report
                    Issue</a>
                <a href="about.html"
                    class="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:bg-primary hover:text-white">About
                    Us</a>
                <a href="contact.html"
                    class="block px-3 py-2 rounded-md text-base font-medium text-gray-600 hover:bg-primary hover:text-white">Contact</a>
                <div class="px-3 py-2">
                    <button id="mobile-dark-mode-toggle"
                        class="w-full text-left p-2 rounded-md text-base font-medium text-gray-600 hover:bg-gray-100 transition duration-150">
                        <i class="fas fa-moon mr-2"></i>Toggle Dark Mode
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="py-12 md:py-16">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-8 text-center"><i
                    class="fas fa-list-ul mr-2 text-primary"></i>Community Issues Tracker</h1>

            <div class="bg-white p-6 rounded-2xl shadow-lg mb-8">
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 items-center">
                    <div class="lg:col-span-2">
                        <div class="relative">
                            <input type="text" id="search-issues" placeholder="Search issues by title or description..."
                                class="w-full p-3 border border-gray-300 rounded-xl focus:ring-primary focus:border-primary transition duration-150 shadow-sm pl-10">
                            <i class="fas fa-search absolute left-3 top-3.5 text-gray-400"></i>
                        </div>
                    </div>
                    <div>
                        <select id="filter-category"
                            class="w-full p-3 border border-gray-300 rounded-xl focus:ring-primary focus:border-primary transition duration-150 shadow-sm appearance-none bg-white">
                            <option value="all">All Categories</option>
                            <option value="Roads">Roads</option>
                            <div class="bg-white rounded-2xl shadow-xl overflow-hidden hover:shadow-2xl transition duration-300 transform hover:scale-[1.02] issue-card"
                                data-category="Public Safety" data-status="Resolved">
                                <div class="h-40 bg-gray-300 flex items-center justify-center relative">
                                    <p class="text-gray-500 font-medium">Issue Photo Placeholder</p>
                                </div>
                                <div class="p-5">
                                    <div class="flex justify-between items-start mb-3"><span
                                            class="text-xs font-semibold px-3 py-1 rounded-full bg-purple-100 text-purple-700 category-badge"
                                            data-category="Public Safety">Public Safety</span><span
                                            class="text-xs font-semibold px-3 py-1 rounded-full bg-secondary text-white status-badge"
                                            data-status="Resolved">Resolved</span></div>
                                    <h3 class="text-xl font-bold mb-2 truncate">Damaged Railing on Pedestrian Bridge
                                    </h3>
                                    <p class="text-sm text-gray-500 mb-4 flex items-center"><i
                                            class="fas fa-map-marker-alt mr-2"></i>Riverview Bridge, South Side</p><a
                                        href="details.html?id=5"
                                        class="w-full block text-center bg-primary text-white font-semibold py-2 rounded-xl hover:bg-indigo-700 transition duration-300">View
                                        Details <i class="fas fa-arrow-right ml-2"></i></a>
                                </div>
                            </div>
                            <div class="bg-white rounded-2xl shadow-xl overflow-hidden hover:shadow-2xl transition duration-300 transform hover:scale-[1.02] issue-card"
                                data-category="Roads" data-status="Pending">
                                <div class="h-40 bg-gray-300 flex items-center justify-center relative">
                                    <p class="text-gray-500 font-medium">Issue Photo Placeholder</p>
                                </div>
                                <div class="p-5">
                                    <div class="flex justify-between items-start mb-3"><span
                                            class="text-xs font-semibold px-3 py-1 rounded-full bg-indigo-100 text-indigo-700 category-badge"
                                            data-category="Roads">Roads</span><span
                                            class="text-xs font-semibold px-3 py-1 rounded-full bg-red-100 text-red-700 status-badge"
                                            data-status="Pending">Pending</span></div>
                                    <h3 class="text-xl font-bold mb-2 truncate">Missing Stop Sign at Intersection</h3>
                                    <p class="text-sm text-gray-500 mb-4 flex items-center"><i
                                            class="fas fa-map-marker-alt mr-2"></i>Oak & Maple Intersection</p><a
                                        href="details.html?id=6"
                                        class="w-full block text-center bg-primary text-white font-semibold py-2 rounded-xl hover:bg-indigo-700 transition duration-300">View
                                        Details <i class="fas fa-arrow-right ml-2"></i></a>
                                </div>
                            </div>
                    </div>

                    <div id="no-issues-message" class="text-center p-8 bg-white rounded-xl shadow-lg mt-8 hidden">
                        <p class="text-xl text-gray-600 font-semibold"><i class="fas fa-info-circle mr-2"></i>No issues
                            match the current filters.</p>
                        <p class="text-gray-500 mt-2">Try adjusting your category or status selection.</p>
                    </div>
                </div>
    </main>

    <footer class="bg-gray-900 text-white py-8 mt-12">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="mb-4 text-sm">&copy; 2025 CrowdSolve. All rights reserved. | Empowering Civic Action.</p>
            <div class="flex justify-center space-x-6 text-xl">
                <a href="#" class="hover:text-primary transition duration-200"><i class="fab fa-twitter"></i></a>
                <a href="#" class="hover:text-primary transition duration-200"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="hover:text-primary transition duration-200"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // JS for filtering and searching issues
        function filterIssues() {
            const category = document.getElementById('filter-category').value;
            const status = document.getElementById('filter-status').value;
            const searchTerm = document.getElementById('search-issues').value.toLowerCase();
            const cards = document.querySelectorAll('.issue-card');
            let visibleCount = 0;

            cards.forEach(card => {
                const cardCategory = card.getAttribute('data-category');
                const cardStatus = card.getAttribute('data-status');
                const cardTitle = card.querySelector('h3').textContent.toLowerCase();

                const categoryMatch = category === 'all' || cardCategory === category;
                const statusMatch = status === 'all' || cardStatus === status;
                const searchMatch = cardTitle.includes(searchTerm);

                if (categoryMatch && statusMatch && searchMatch) {
                    card.style.display = 'block';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            // Show/hide no issues message
            const noIssuesMessage = document.getElementById('no-issues-message');
            if (visibleCount === 0) {
                noIssuesMessage.classList.remove('hidden');
            } else {
                noIssuesMessage.classList.add('hidden');
            }
        }

        document.getElementById('filter-category').addEventListener('change', filterIssues);
        document.getElementById('filter-status').addEventListener('change', filterIssues);
        document.getElementById('search-issues').addEventListener('keyup', filterIssues);
    </script>
</body>

</html>
