    <!-- GEOAPIFY + CANVAS SCRIPT -->
    <script>

        // Your Geoapify Key
        const API_KEY = "5f9fbee73ad8419a94a9937ee7c9a57e";

        const imageInput = document.getElementById("image-upload");
        const locationBox = document.getElementById("location");
        const pincodeBox = document.getElementById("pincode");
        const mapFrame = document.getElementById("mapFrame");
        const canvas = document.getElementById("photoCanvas");
        const ctx = canvas.getContext("2d");

        // Image Upload Handler
        imageInput.addEventListener("change", async () => {
            const file = imageInput.files[0];
            if (!file) return;

            const img = new Image();
            img.src = URL.createObjectURL(file);

            img.onload = () => {
                // Try to get EXIF data first
                EXIF.getData(img, function () {
                    const lat = EXIF.getTag(this, "GPSLatitude");
                    const lng = EXIF.getTag(this, "GPSLongitude");
                    const latRef = EXIF.getTag(this, "GPSLatitudeRef");
                    const lngRef = EXIF.getTag(this, "GPSLongitudeRef");

                    if (lat && lng && latRef && lngRef) {
                        const latitude = convertDMSToDD(lat, latRef);
                        const longitude = convertDMSToDD(lng, lngRef);
                        updateLocationUI(latitude, longitude);
                        stampPhoto(img, latitude, longitude);
                    } else {
                        // Fallback to device location
                        navigator.geolocation.getCurrentPosition(
                            (pos) => {
                                const latitude = pos.coords.latitude;
                                const longitude = pos.coords.longitude;
                                updateLocationUI(latitude, longitude);
                                stampPhoto(img, latitude, longitude);
                            },
                            (err) => {
                                console.error("Location access denied or error:", err);
                                const lang = window.currentLang || 'en';
                                locationBox.value = window.translations[lang]['msg_location_not_found'] || "Location not found. Please enter manually.";
                                stampPhoto(img, null, null);
                            }
                        );
                    }
                });
            };
        });

        // Helper: Convert DMS to Decimal Degrees
        function convertDMSToDD(dms, ref) {
            let dd = dms[0] + dms[1] / 60 + dms[2] / 3600;
            if (ref === "S" || ref === "W") {
                dd = dd * -1;
            }
            return dd;
        }

        // Helper: Update UI with Location
        async function updateLocationUI(lat, lng) {
            console.log("Fetching location for coordinates:", lat, lng);
            mapFrame.src = `https://www.google.com/maps?q=${lat},${lng}&output=embed`;

            try {
                const response = await fetch(
                    `https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lng}&format=json&apiKey=${API_KEY}`
                );
                const data = await response.json();

                console.log("Geoapify API Response:", data);

                if (data.results && data.results.length > 0) {
                    const info = data.results[0];
                    console.log("Location data:", info);

                    // Set the formatted address
                    locationBox.value = info.formatted || "Unknown Address";

                    // Try multiple possible pin code field names
                    const pinCode = info.postcode || info.postal_code || info.zip_code ||
                        info.zip || info.postalcode || "";

                    console.log("Pin Code found:", pinCode);
                    pincodeBox.value = pinCode;

                    if (!pinCode) {
                        console.warn("No pin code found in response. Available fields:", Object.keys(info));
                    }
                } else {
                    const lang = window.currentLang || 'en';
                    locationBox.value = window.translations[lang]['msg_address_not_found'] || "Address not found";
                    console.warn("No results found in API response");
                }
            } catch (error) {
                console.error("Reverse geocoding failed:", error);
                const lang = window.currentLang || 'en';
                locationBox.value = window.translations[lang]['msg_error_fetching'] || "Error fetching address";
            }
        }

        // Main Stamping Function
        function stampPhoto(img, lat, lng) {
            canvas.width = img.width;
            canvas.height = img.height;

            ctx.drawImage(img, 0, 0);

            // Only stamp if we have coordinates
            if (lat && lng) {
                ctx.font = `${canvas.width * 0.03}px Arial`;
                ctx.fillStyle = "yellow";
                ctx.strokeStyle = "black";
                ctx.lineWidth = 4;

                const timestamp = new Date().toLocaleString();

                const lines = [
                    `Time: ${timestamp}`,
                    `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`
                ];

                let x = 40;
                let y = canvas.height - 150;

                lines.forEach(line => {
                    ctx.strokeText(line, x, y);
                    ctx.fillText(line, x, y);
                    y += 55;
                });
            }

            canvas.classList.remove("hidden");
        }

        // Form Submit Handler - Save to LocalStorage Database
        document.getElementById('issue-report-form').addEventListener('submit', function (e) {
            e.preventDefault();

            // Get form values
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const description = document.getElementById('description').value;
            const address = document.getElementById('location').value;
            const pincode = document.getElementById('pincode').value;

            // Get coordinates from map URL
            let latitude = null;
            let longitude = null;
            const mapSrc = document.getElementById('mapFrame').src;
            if (mapSrc) {
                const match = mapSrc.match(/q=([-\d.]+),([-\d.]+)/);
                if (match) {
                    latitude = parseFloat(match[1]);
                    longitude = parseFloat(match[2]);
                }
            }

            // Get image from canvas as Base64
            let imageData = null;
            const canvas = document.getElementById('photoCanvas');
            if (canvas && !canvas.classList.contains('hidden')) {
                imageData = canvas.toDataURL('image/jpeg', 0.7);
            }

            // Save to LocalStorage Database
            const result = Database.createIssue({
                title: title,
                description: description,
                category: category.toLowerCase().replace(' ', '_'),
                address: address,
                city: pincode,
                latitude: latitude,
                longitude: longitude,
                priority: 'medium',
                imageUrl: imageData
            });

            if (result.success) {
                const lang = window.currentLang || 'en';
                const msg = window.translations[lang]['msg_issue_submitted'] || "Issue submitted successfully! Issue ID: ";
                alert(msg + result.issue.id);
                console.log('Issue saved:', result.issue);
                console.log('Address saved:', result.issue.address);
                console.log('Image saved:', result.issue.imageUrl ? 'Yes (Base64)' : 'No');
                console.log('All issues:', Database.getAllIssues());

                // Reset form
                this.reset();
                document.getElementById('photoCanvas').classList.add('hidden');
                document.getElementById('mapFrame').src = '';
                document.getElementById('location').value = '';
                document.getElementById('pincode').value = '';
            } else {
                alert('Error: ' + result.message);
            }
        });

    </script>
